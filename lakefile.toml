name = "even-wrong"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["EvenWrong", "NotWrong", "EvenWrongProbEval"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.31.0"

[[require]]
name = "VCVio"
scope = "Verified-zkEVM"
rev = "v4.31.0"

[[lean_lib]]
name = "EvenWrong"

[[lean_lib]]
name = "NotWrong"

# `EvenWrong.Computability.ProbEval` depends on `VCVio`, which is not modulized, so it
# cannot be a `module` and therefore cannot be reached from the `EvenWrong` root module.
# It gets its own target so that it is still built and checked.
[[lean_lib]]
name = "EvenWrongProbEval"
roots = ["EvenWrong.Computability.ProbEval"]
